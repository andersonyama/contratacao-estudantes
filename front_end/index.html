<!DOCTYPE html>
<html lang="pt_BR">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">

        <link rel="stylesheet" href="styles.css">

        <title>Previsão de contratação de graduando</title>
    </head>

    <body>
        <header>
            <div class="title">
                <h1>Previsão de contratação de graduando</h1>
            </div>
        </header>

        <main>
            <section class="form-section">
                <h2>Input de dados</h2>
                <form id="graduando-form">
                    
                    <input type="text" id="nome" name="nome" required placeholder="Nome">
                    <input type="number" id="rank_universidade" name="tier_universidade" required min="1" max="3" placeholder="Tier Universidade (1-3)">
                    <input type="text" inputmode="decimal" id="cgpa" name="gpa_acumulado" required min="0" max="10" placeholder="GPA Acumulado">
                    <input type="text" inputmode="decimal" id="coding_skills" name="nota_programacao" required min="0" max="10" placeholder="Nota Programação">
                    <input type="text" inputmode="decimal" id="dsa_score" name="nota_dsa" required min="0" max="10" placeholder="Nota DSA">
                    <input type="number" id="internships" name="quant_estagios" required min="0" max="3" placeholder="Qtd Estágios (0-3)">

                    <button onclick="estimarContratacao()" type="button">Avaliar</button>
                </form>
            </section>

            <section class="table-section">
                <div class="table-container">
                    <table id="table-estudantes">
                        <tr>
                            <th>Nome</th>
                            <th>Tier Universidade</th>
                            <th>GPA Acumulado</th>
                            <th>Nota Programação</th>
                            <th>Nota DSA</th>
                            <th>Quantidade Estágios</th>
                            <th>Previsão Contratação</th>
                        </tr>
                    </table>
                </div>
            </section>
        </main>

        <footer>
            <p>Desenvolvido por Anderson Hideki Yamamura</p>
        </footer>

        <script>
            window.HOST_API = "http://127.0.0.1:5000/";
        </script>
        <script src="script.js"></script>
    </body>
</html>
