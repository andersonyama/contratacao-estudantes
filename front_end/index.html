<!DOCTYPE html>
<html lang="pt_BR">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">

        <link rel="stylesheet" href="styles.css">

        <title>Previsão de contratação de graduando</title>
    </head>

    <body>
        <header>
            <div class="title">
                <h1>Previsão de contratação de graduando</h1>
            </div>
        </header>

        <main>
            <section class="form-section">
                <h2>Input de dados</h2>
                <form id="graduando-form">
                    <label for="rank_universidade">Tier Universidade</label>
                    <input type="number" id="rank_universidade" name="tier_universidade" required min="1" max="3">
                    
                    <label for="cgpa">GPA Acumulado</label>
                    <input type="text" inputmode="decimal" id="cgpa" name="gpa_acumulado" required min="0" max="10">

                    <label for="coding_skills">Nota Programação</label>
                    <input type="text" inputmode="decimal" id="coding_skills" name="nota_programacao" required min="0" max="10">

                    <label for="dsa_score">Nota DSA</label>
                    <input type="text" inputmode="decimal" id="dsa_score" name="nota_dsa" required min="0" max="10">

                    <label for="internships">Quantidade Estágios</label>
                    <input type="number" id="internships" name="quant_estagios" required min="0" max="3">

                    <button type="submit">Avaliar</button>
                </form>
            </section>
        </main>

        <footer>
            <p>Desenvolvido por Anderson Hideki Yamamura</p>
        </footer>
    </body>
</html>
